name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Run automated test suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm paku.spec

      - name: Verify build output and execute binary smoke tests
        shell: pwsh
        run: |
          if (!(Test-Path "dist/paku.exe")) {
            Write-Error "Build failed: dist/paku.exe not found"
            exit 1
          }
          $size = (Get-Item "dist/paku.exe").Length
          if ($size -lt 1MB) {
            Write-Error "Build suspicious: paku.exe is only $size bytes"
            exit 1
          }
          Copy-Item "dist/paku.exe" "dist/paku-windows-x64.exe"

          Write-Host "Running smoke test: .\dist\paku-windows-x64.exe --help"
          .\dist\paku-windows-x64.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Running smoke test: .\dist\paku-windows-x64.exe self-test"
          .\dist\paku-windows-x64.exe self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Running smoke test: .\dist\paku-windows-x64.exe clean --dry-run"
          .\dist\paku-windows-x64.exe clean --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Running smoke test: .\dist\paku-windows-x64.exe system disk"
          .\dist\paku-windows-x64.exe system disk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: paku-windows-x64
          path: dist/paku-windows-x64.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build Linux executable
        run: pyinstaller --clean --noconfirm paku.spec

      - name: Verify build output and execute binary smoke tests
        run: |
          if [ ! -s dist/paku ]; then
            echo "Build failed: dist/paku not found or empty"
            exit 1
          fi
          size=$(stat -c%s dist/paku)
          if [ "$size" -lt 1048576 ]; then
            echo "Build suspicious: paku is only $size bytes"
            exit 1
          fi
          cp dist/paku dist/paku-linux-x64
          chmod +x dist/paku-linux-x64

          echo "Running smoke test: ./dist/paku-linux-x64 --help"
          ./dist/paku-linux-x64 --help

          echo "Running smoke test: ./dist/paku-linux-x64 self-test"
          ./dist/paku-linux-x64 self-test

          echo "Running smoke test: ./dist/paku-linux-x64 clean --dry-run"
          ./dist/paku-linux-x64 clean --dry-run

          echo "Running smoke test: ./dist/paku-linux-x64 system disk"
          ./dist/paku-linux-x64 system disk

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: paku-linux-x64
          path: dist/paku-linux-x64
          retention-days: 7
