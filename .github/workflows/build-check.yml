name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: pyinstaller paku.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/paku.exe")) {
            Write-Error "Build failed: dist/paku.exe not found"
            exit 1
          }
          $size = (Get-Item "dist/paku.exe").Length
          if ($size -lt 1MB) {
            Write-Error "Build suspicious: paku.exe is only $size bytes"
            exit 1
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: paku-exe
          path: dist/paku.exe
          retention-days: 7
